<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Tokimeki-Planner</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: #d0d5dd;
        --bg-soft: #f6f7f9;
        --accent: #2f6fed;
        --muted: #5b6472;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
        line-height: 1.6;
        color: #1a1c1f;
        background: #fff;
      }
      header {
        padding: 16px 22px 10px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 19px;
      }
      header p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 380px) 1fr;
      }
      #input-pane {
        padding: 16px 22px;
        border-right: 1px solid var(--line);
        background: var(--bg-soft);
      }
      #result-pane {
        padding: 16px 22px;
        min-width: 0;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 10px;
        letter-spacing: 0.04em;
        color: #3b4250;
      }
      .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .field input {
        width: 96px;
        padding: 4px 6px;
        font: inherit;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #fff;
      }
      #attributes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
        margin-bottom: 16px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      button,
      .file-button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .file-button input {
        display: none;
      }
      small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      #status {
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 6px;
        background: #eef1f5;
        margin-bottom: 10px;
        white-space: pre-wrap;
      }
      #status.error {
        background: #fdeceb;
        color: #8c1d18;
      }
      #summary {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      #summary b {
        color: #1a1c1f;
      }
      .calendar-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .calendar-tools input {
        font: inherit;
        font-size: 13px;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      #calendar {
        max-height: 64vh;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      table.calendar {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      table.calendar th,
      table.calendar td {
        padding: 2px 8px;
        border-bottom: 1px solid #eceff3;
        text-align: left;
        white-space: nowrap;
      }
      tr.week-row th {
        background: #eef1f5;
        font-weight: 600;
        color: #3b4250;
      }
      tr.week-row .week-flag {
        font-weight: 400;
        color: var(--muted);
        margin-left: 10px;
      }
      tr.day-row td.state {
        color: var(--muted);
      }
      tr.day-row.is-rest td {
        background: #fff5f5;
      }
      tr.day-row.is-empty td {
        background: #f1f2f4;
        color: #8b93a1;
      }
      tr.day-row.is-unsettled td {
        color: #8b93a1;
      }
      tr.day-row td input[type="checkbox"] {
        margin: 0;
      }
      tr.day-row.is-highlight td {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tokimeki-Planner</h1>
      <p>《心跳回忆·永远属于你》（95 版）日程规划工具 · 单文件、离线、零依赖</p>
    </header>

    <main>
      <section id="input-pane">
        <h2>起点</h2>
        <div class="field">
          <span>当前日期</span>
          <input id="start-date" type="date" />
        </div>

        <h2 style="margin-top: 16px">当前属性</h2>
        <div id="attributes"></div>

        <div class="actions">
          <button id="btn-plan" class="primary" type="button">生成</button>
          <button id="btn-export" type="button">导出 JSON</button>
          <label class="file-button">
            导入 JSON
            <input id="file-import" type="file" accept="application/json,.json" />
          </label>
        </div>
        <small>JSON 只保存输入，结果永远由输入重新算出。</small>
      </section>

      <section id="result-pane">
        <h2>结果</h2>
        <div id="status">尚未计算。</div>
        <div id="summary"></div>
        <div class="calendar-tools">
          <label>跳到日期 <input id="jump-date" type="date" /></label>
          <button id="btn-jump" type="button">跳转</button>
        </div>
        <div id="calendar"></div>
      </section>
    </main>

    <script id="worker-source" type="text/plain">
/*__WORKER__*/
    </script>

    <script>
/*__APP__*/
    </script>
  </body>
</html>
