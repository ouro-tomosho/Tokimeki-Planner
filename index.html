<!-- 本文件由 `npm run build` 生成，禁止手改。开发源在 web/template.html、src/ 与 data/。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Tokimeki-Planner</title>
    <style>
      /* 视觉基调＝A 版（1995 纸面台账）。令牌与取值见下方 :root。 */
      :root {
        --paper: #efe4cd;
        --panel: #fbf5e6;
        --panel-2: #f3e9d2;
        --panel-3: #e7d9bb;
        --ink: #2e2622;
        --ink-2: #6b5b4c;
        --ink-3: #77675a;
        --line: #c9b691;
        --line-2: #a89070;
        --line-3: #7d6746;
        --rose: #c2506b;
        --rose-deep: #a83350;
        --rose-soft: #f6dde3;
        --rose-line: #d9a3b1;
        --green: #2f6b4a;
        --green-soft: #e6f0e9;
        --amber: #7d5f18;
        --amber-soft: #f2e7c9;
        --cell: #fffdf5;
        --cell-sun: #f0e2c6;
        --cell-off: #e9dec4;
        --raise: inset 1px 1px 0 #fffdf6, inset -1px -1px 0 #cdb896;
        --sink: inset -1px -1px 0 #fffdf6, inset 1px 1px 0 #cdb896;
        --font-ui: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      /* 类选择器上的 display 会盖过 hidden 属性，所以这里统一把 hidden 摆到最高优先级。 */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(rgba(125, 103, 70, 0.16) 1px, transparent 1.2px);
        background-size: 6px 6px;
      }
      /* 全页唯一允许的圆角例外是状态点；其余一律 0。 */
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-weight: 700;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }

      /* ---------------------------------------------------------------- 顶栏 */
      .topbar {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 14px;
        background: linear-gradient(180deg, #f4e9d1, #e5d6b4);
        border-bottom: 3px double var(--line-3);
        box-shadow: inset 0 1px 0 #fffdf6;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }
      .brand h1 {
        font-size: 20px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .brand .subtitle {
        font-size: 12px;
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand svg {
        vertical-align: -2px;
        margin-right: 2px;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chip {
        font-size: 12px;
        padding: 3px 10px;
        border: 1px solid var(--line-2);
        border-radius: 0;
        background: var(--panel-2);
        box-shadow: var(--raise);
        white-space: nowrap;
      }
      .chip.met {
        color: var(--green);
        border-color: var(--green);
        background: var(--green-soft);
      }
      .chip.unmet {
        color: var(--rose-deep);
        border-color: var(--rose-line);
        background: #fbeff2;
      }

      /* ---------------------------------------------------------------- 控件 */
      .btn {
        font-size: 12px;
        padding: 5px 11px;
        border: 1px solid var(--line-2);
        border-radius: 0;
        background: linear-gradient(180deg, #fdf8ec, #f0e6d1);
        box-shadow: var(--raise);
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover {
        background: linear-gradient(180deg, #fffdf5, #f5ecd8);
      }
      .btn:active {
        box-shadow: var(--sink);
      }
      .btn[disabled] {
        color: var(--ink-3);
        cursor: default;
        opacity: 0.7;
      }
      .btn-primary {
        color: #fffafb;
        font-weight: 700;
        border-color: var(--rose-deep);
        background: linear-gradient(180deg, #c85a72, #ab3c55);
        box-shadow: inset 1px 1px 0 #e79aab, inset -1px -1px 0 #8d2a43;
      }
      .btn-primary:hover {
        background: linear-gradient(180deg, #d0687e, #b8465f);
      }
      .btn-icon {
        padding: 4px 9px;
        font-size: 13px;
        line-height: 1.1;
      }
      .btn-quiet {
        background: var(--panel);
      }
      .file-btn input {
        display: none;
      }
      input[type="date"],
      input[type="number"],
      input[type="text"],
      select {
        font-size: 12px;
        padding: 3px 5px;
        border: 1px solid var(--line-2);
        border-radius: 0;
        background: #fffdf7;
        box-shadow: var(--sink);
        max-width: 100%;
      }
      .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .field > span {
        color: var(--ink-2);
        white-space: nowrap;
      }
      .hint {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--ink-3);
      }

      /* ---------------------------------------------------------------- 骨架 */
      .shell {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: calc(100vh - 56px);
      }
      .shell.collapsed {
        grid-template-columns: 46px 1fr;
      }
      .rail {
        overflow: auto;
        padding: 10px;
        border-right: 1px solid var(--line-2);
        background: rgba(251, 245, 230, 0.55);
      }
      .shell.collapsed .rail .panel,
      .shell.collapsed .rail .btn-collapse span {
        display: none;
      }
      .btn-collapse {
        width: 100%;
        margin-bottom: 8px;
      }
      .shell.collapsed .btn-collapse {
        padding: 5px 4px;
      }
      .panel {
        margin-bottom: 10px;
        padding: 8px 9px;
        border: 1px solid var(--line-2);
        background: var(--panel);
        box-shadow: 0 1px 0 rgba(125, 103, 70, 0.18);
      }
      .panel h2 {
        font-size: 13px;
        margin-bottom: 7px;
        padding-bottom: 4px;
        border-bottom: 1px dashed var(--line-2);
        color: var(--ink);
      }
      .attr-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px 6px;
      }
      .attr-cell {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 12px;
      }
      .attr-cell > span {
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .attr-cell input {
        width: 100%;
        font-variant-numeric: tabular-nums;
      }
      .attr-cell.down > span::after {
        content: " ▼";
        font-size: 12px;
        color: var(--rose-deep);
      }

      .work {
        overflow: auto;
        padding: 10px 12px 30px;
        min-width: 0;
      }
      .pinned {
        position: sticky;
        top: -10px;
        z-index: 5;
        background: var(--paper);
        background-image: radial-gradient(rgba(125, 103, 70, 0.16) 1px, transparent 1.2px);
        background-size: 6px 6px;
        padding-top: 10px;
        margin-top: -10px;
      }
      /* 视口不够高时，日历 + 详情条撑不下：退化为整栏滚动，别把达标清单挤出屏幕。 */
      @media (max-height: 760px) {
        .pinned {
          position: static;
          margin-top: 0;
          padding-top: 0;
        }
      }

      /* ---------------------------------------------------------------- 日历工具行 */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 7px 9px;
        border: 1px solid var(--line-2);
        background: linear-gradient(180deg, #efe2c6, #e4d4b1);
        box-shadow: var(--raise);
      }
      .month-label {
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        min-width: 168px;
        text-align: center;
      }
      .toolbar-gap {
        flex: 1 1 auto;
      }
      .jump {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--ink-2);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        padding: 6px 2px 7px;
        font-size: 12px;
        color: var(--ink-2);
      }
      .legend i {
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 4px;
        vertical-align: -1px;
        border: 1px solid var(--line-2);
      }
      .legend .k-weekday i {
        background: var(--cell);
      }
      .legend .k-sun i {
        background: var(--cell-sun);
      }
      .legend .k-rest i {
        background: var(--rose-soft);
        border-color: var(--rose-line);
      }
      .legend .k-empty i {
        background: repeating-linear-gradient(135deg, #e2d6ba 0 3px, #c6b795 3px 4px);
      }
      .legend .k-flag i {
        background: var(--rose);
        border-color: var(--rose-deep);
      }
      .legend .k-played i {
        border-left: 3px solid var(--line-3);
        background: var(--cell);
      }

      /* ---------------------------------------------------------------- 日历 */
      .cal-months {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .month {
        border: 1px solid var(--line-2);
        background: var(--panel);
        padding: 6px;
        box-shadow: 0 1px 0 rgba(125, 103, 70, 0.18);
        min-width: 0;
      }
      .month-title {
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        padding: 3px 0 5px;
        margin-bottom: 5px;
        background: linear-gradient(180deg, #f4e9d1, #e5d6b4);
        border: 1px solid var(--line-2);
        box-shadow: var(--raise);
        font-variant-numeric: tabular-nums;
      }
      .dow,
      .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
      }
      .dow {
        gap: 2px;
        margin-bottom: 2px;
      }
      .dow span {
        font-size: 12px;
        text-align: center;
        color: var(--ink-2);
        padding: 2px 0;
        border: 1px solid var(--line);
        background: var(--panel-2);
      }
      .dow span:first-child {
        color: var(--rose-deep);
      }
      .grid {
        gap: 2px;
      }
      .cell {
        position: relative;
        min-height: 46px;
        padding: 2px 3px;
        border: 1px solid #ded0b2;
        background: var(--cell);
        cursor: pointer;
        overflow: hidden;
      }
      .cell .dn {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        display: block;
        line-height: 1.25;
      }
      .cell .dcmd {
        display: block;
        font-size: 12px;
        line-height: 1.25;
        color: var(--ink);
        word-break: break-all;
      }
      .cell .flags {
        position: absolute;
        top: 2px;
        right: 3px;
        display: flex;
        gap: 2px;
        align-items: center;
      }
      /* 一个旗＝一条小目标：红旗达标、白旗未达标。 */
      .flag {
        width: 9px;
        height: 9px;
        border: 1px solid var(--ink);
        background: #fff;
        display: inline-block;
      }
      .flag.met {
        background: var(--rose);
        border-color: var(--rose-deep);
      }
      .flag-count {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        background: var(--panel-2);
        border: 1px solid var(--ink-2);
        padding: 0 2px;
        line-height: 1.2;
      }
      .cell.is-sun {
        background: var(--cell-sun);
      }
      /* 周日与休息日的日期数字用星期栏「日」的同一个红：一周里哪几天要单独下指令，一眼可见。 */
      .cell.is-sun .dn,
      .cell.is-rest .dn {
        color: var(--rose-deep);
      }
      .cell.is-rest {
        background: var(--rose-soft);
        border-color: var(--rose-line);
      }
      .cell.is-empty {
        background: repeating-linear-gradient(135deg, #e2d6ba 0 4px, #c6b795 4px 5px);
      }
      .cell.is-ovf {
        background: var(--cell-off);
        border-style: dashed;
        color: var(--ink-3);
        cursor: not-allowed;
      }
      .cell.is-ovf .dcmd {
        color: var(--ink-3);
      }
      .cell.is-played {
        border-left: 3px solid var(--line-3);
      }
      .cell.is-range {
        background: #fbe9ee;
      }
      .cell.is-selected {
        background: var(--rose-soft);
        outline: 2px solid var(--rose-deep);
        outline-offset: -2px;
        border-color: var(--rose-deep);
        z-index: 2;
      }
      .cell.is-flash {
        animation: cellflash 0.42s ease-out 3;
      }
      @keyframes cellflash {
        0%,
        100% {
          box-shadow: none;
        }
        50% {
          box-shadow: inset 0 0 0 3px rgba(194, 80, 107, 0.6);
        }
      }

      /* ---------------------------------------------------------------- 当日详情条 */
      .detail-wrap {
        display: flex;
        gap: 8px;
        align-items: stretch;
        margin-top: 8px;
      }
      .detail {
        flex: 1 1 auto;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--line-2);
        background: var(--panel);
        box-shadow: 0 4px 10px rgba(125, 103, 70, 0.18);
        display: grid;
        grid-template-columns: 190px 1fr;
        gap: 6px 10px;
      }
      .detail .when {
        font-size: 12px;
      }
      .detail .when strong {
        font-variant-numeric: tabular-nums;
      }
      .detail .when p {
        margin: 2px 0 0;
        color: var(--ink-2);
      }
      .detail .attrs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px 10px;
        min-width: 0;
      }
      .detail .attr {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 5px;
        font-size: 12px;
        padding: 1px 0;
        border-bottom: 1px dotted var(--line);
      }
      .detail .attr b {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .detail .range-note {
        grid-column: 1 / -1;
        font-size: 12px;
        color: var(--amber);
        background: var(--amber-soft);
        border: 1px dashed var(--line-2);
        padding: 3px 6px;
      }
      .btn-more {
        align-self: flex-start;
      }

      /* ---------------------------------------------------------------- 计算状态 */
      .compute-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
        padding: 7px 9px;
        border: 1px dashed var(--line-2);
        background: rgba(251, 245, 230, 0.6);
        font-size: 12px;
      }
      .compute-row.is-dirty {
        border-color: var(--amber);
        background: var(--amber-soft);
        color: var(--amber);
      }
      .progress {
        display: inline-block;
        width: 190px;
        height: 11px;
        border: 1px solid var(--line-2);
        background: #fffdf7;
        box-shadow: var(--sink);
        overflow: hidden;
        vertical-align: -2px;
      }
      .progress-bar {
        display: block;
        height: 100%;
        width: 40%;
        background: repeating-linear-gradient(
          115deg,
          var(--rose) 0 7px,
          #e7a5b4 7px 14px
        );
        animation: indeterminate 1.1s linear infinite;
      }
      @keyframes indeterminate {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress-bar {
          animation-duration: 3s;
        }
        .cell.is-flash {
          animation: none;
          box-shadow: inset 0 0 0 3px rgba(194, 80, 107, 0.6);
        }
      }
      .elapsed {
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
      }
      .stale-note {
        margin-left: auto;
        font-size: 12px;
        color: var(--ink-3);
      }

      /* 陈旧态：数值、旗帜、达标清单都基于上一次计算。 */
      .stale {
        filter: saturate(0.5);
        outline: 1px dashed var(--line-2);
        outline-offset: 2px;
      }

      /* ---------------------------------------------------------------- 达标清单 */
      .results {
        margin-top: 4px;
      }
      .goals-head {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 700;
        padding: 6px 9px;
        border: 1px solid var(--line-2);
        background: linear-gradient(180deg, #efe2c6, #e4d4b1);
        box-shadow: var(--raise);
      }
      .goals-head .count {
        font-weight: 400;
        color: var(--ink-2);
        font-size: 12px;
      }
      .goal-group {
        margin-top: 8px;
        border: 1px solid var(--line-2);
        background: var(--panel);
      }
      .goal-group > header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 9px;
        border-bottom: 1px solid var(--line-2);
        background: var(--panel-2);
        font-size: 12px;
        font-weight: 700;
      }
      .goal-group > header .count {
        font-weight: 400;
        color: var(--ink-2);
        margin-left: auto;
      }
      .goal-cols,
      .goal-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 92px 110px 92px 78px 74px;
        gap: 6px;
        align-items: center;
        padding: 3px 9px;
        font-size: 12px;
      }
      .goal-cols {
        color: var(--ink-3);
        border-bottom: 1px dotted var(--line);
        padding-top: 4px;
        padding-bottom: 4px;
      }
      .goal-row {
        border-bottom: 1px dotted var(--line);
      }
      .goal-row:last-child {
        border-bottom: 0;
      }
      .goal-row.unmet {
        background: #fbeff2;
      }
      .goal-row .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .goal-row .v {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .goal-row .gap {
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: var(--ink-3);
      }
      .goal-row .state {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--ink-2);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        flex: 0 0 auto;
      }
      .dot.met {
        background: var(--green);
      }
      .dot.unmet {
        border: 2px solid var(--rose-deep);
        background: transparent;
      }
      /* 硬违反（达成后跌破，一次即永久）：与"还欠着"分开着色，左侧加一条实线。 */
      .dot.violated {
        border: 1px solid var(--ink);
        background: var(--rose-deep);
      }
      .goal-row.violated {
        background: #f6e3ea;
        box-shadow: inset 3px 0 0 var(--rose-deep);
      }

      .row-actions {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
      }
      .row-actions .btn {
        padding: 2px 6px;
      }
      .foot {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      /* ---------------------------------------------------------------- 右键菜单 */
      .menu {
        position: fixed;
        z-index: 40;
        min-width: 190px;
        padding: 3px;
        border: 1px solid var(--line-3);
        background: var(--panel);
        box-shadow: 3px 3px 0 rgba(125, 103, 70, 0.3);
      }
      .menu-item {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .menu-item:hover {
        background: var(--panel-3);
      }
      .menu-item[disabled] {
        color: var(--ink-3);
        cursor: default;
      }
      .menu-item[disabled]:hover {
        background: transparent;
      }
      .menu-sep {
        height: 0;
        margin: 3px 6px;
        border-top: 1px dashed var(--line-2);
      }

      /* ---------------------------------------------------------------- 弹窗 */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(46, 38, 34, 0.28);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 8vh;
      }
      .modal-card {
        width: min(560px, 92vw);
        border: 1px solid var(--line-3);
        background: var(--panel);
        box-shadow: 4px 4px 0 rgba(125, 103, 70, 0.3);
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 9px;
        background: linear-gradient(180deg, #efe2c6, #e4d4b1);
        border-bottom: 1px solid var(--line-2);
      }
      .modal-head h3 {
        font-size: 13px;
      }
      .modal-body {
        padding: 10px;
        max-height: 60vh;
        overflow: auto;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 8px 10px;

 * ⚠ ① 必须是**二元条数**，不能写成"未达成天数 × 大权重"：那样"让人缘早一天达标"会盖过
 * 全部结局目标，局部搜索于是靠不停聊天把达标日往前挪，把运动/毅力整条饿死
 * （实测：运动 0/130、毅力 15.7/100，而人缘被刷到 196）。"尽早"只是 ⑦ 的细化。
 */

/** 阶段 2（先修硬约束）的轮数。 */
const DEFAULT_REPAIR_FIRST = 10;
/** 阶段 4（再修一次）的轮数。 */
const DEFAULT_REPAIR_LAST = 6;
/** 主线程降级路径的默认预算：必须短到界面还能响应取消。 */
const DEFAULT_BUDGET_MS = 30000;

/**
 * 低于这个预算**不启动搜索**：直接返回确定性基线（暖启动的那份配额日程）。
 *
 * 为什么要有这条：几百毫秒连一次全槽下降都跑不完，而"跑到一半被挂钟切断"会让同一输入
 * 每次停在不同迭代上——那正是确定性承诺被破坏的地方。与其给出一个不可复现的结果，
 * 不如**明确地**退回确定性基线，并在 metrics 里写清 `stopped: 'budget-too-small'`。
 */
const MIN_VIABLE_BUDGET_MS = 3000;

/**
 * 按**请求的预算**挑一档固定工作量。它读的是 `budgetMs` 这个**输入数字**，不是跑出来的
 * 耗时——所以同一输入永远挑到同一档，工作量因此确定。
 *
 *   · `< 3000 ms`  不搜索，直接给确定性基线；
 *   · `< 8000 ms`  （主线程降级路径）轻量档：一两秒内跑完，主线程不卡；
 *   · 其余（Worker 路径）默认档。
 */
function workProfileFor(budgetMs) {
  if (!(budgetMs >= MIN_VIABLE_BUDGET_MS)) {
    return { name: 'none', search: false, passes: 0, ils: 0, repairFirst: 0, repairLast: 0 };
  }
  // 轻量档只做**一次初始下降**（阶段 2/3/4 的轮数为 0 时会被整段跳过）：
  // 主线程降级路径只有 5 s，实测"2 轮下降 + 3 轮改进"要 4–5 s，正好卡在预算上被墙钟切断
  // ——那又不可复现了。一次下降约 0.5 s（配额暖启动之上），既留足余量又是确定结果。
  if (budgetMs < 8000) return { name: 'light', search: true, passes: 1, ils: 0, repairFirst: 0, repairLast: 0 };
  return {
    name: 'default',
    search: true,
    passes: DEFAULT_PASSES,
    ils: DEFAULT_ILS,
    repairFirst: DEFAULT_REPAIR_FIRST,
    repairLast: DEFAULT_REPAIR_LAST,
  };
}

/** 固定种子 PRNG（mulberry32）：不掷骰子，同输入同输出。 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const CLUB_EXPERIENCE = 'clubExperience';

// ---------------------------------------------------------------- 问题构造

function buildProblem(rules, input) {
  const attributes = rules.attributes;
  const ids = attributes.map((a) => a.id);
  const index = Object.fromEntries(ids.map((id, i) => [id, i]));
  const n = ids.length;
  const mins = Float64Array.from(attributes.map((a) => a.min));
  const maxs = Float64Array.from(attributes.map((a) => a.max));
  const start = Float64Array.from(attributes.map((a) => input.attributes[a.id]));

  const calendar = buildCalendar(rules, input);
  const clubAt = createClubLookup(input);
  const settled = calendar.days.filter((day) => day.isSettled);

  // 系数唯一来源：引擎的 expectedEffects（含成功率、休息日 ×4、失败分支）与
  // clubExperienceGainOn（含 8 月集训周加成）。工具与引擎不得各算一套。
  const cache = new Map();
  const effectOf = (commandId, isRestDay, weekStart) => {
    const key = `${commandId}|${isRestDay ? 'r' : 'w'}|${weekStart}`;
    const hit = cache.get(key);
    if (hit) return hit;
    const out = new Float64Array(n);
    if (commandId && commandId !== 'skip') {
      const command = rules.commands.find((c) => c.id === commandId);
      if (!command) throw new Error(`未知指令：${commandId}`);
      const base = expectedEffects(rules, command, isRestDay ? REST_DAY : WEEKDAY);
      for (let i = 0; i < n; i += 1) {
        let value = base[ids[i]];
        if (ids[i] === CLUB_EXPERIENCE && command.kind === 'club') {
          value += clubExperienceGainOn(rules, isRestDay ? REST_DAY : WEEKDAY, { weekStart });
        }
        out[i] = value;
      }
    }
    cache.set(key, out);
    return out;
  };

  // ---- 决策槽 ----
  const slots = [];
  const daySlot = new Int32Array(settled.length);
  const weekSlotOf = new Map();
  const daySlotOf = new Map();
  for (let i = 0; i < settled.length; i += 1) {
    const day = settled[i];
    if (day.isRestDay) continue;
    if (weekSlotOf.has(day.weekStart)) continue;
    const club = clubAt(day.weekStart);
    const mandate = clubWeekMandate(rules, club, day.weekStart);
    const cands = mandate ? [mandate] : availableCommandIds(rules, club, day.weekStart);
    weekSlotOf.set(day.weekStart, slots.length);
    slots.push({ kind: 'week', key: day.weekStart, isRestDay: false, cands, dayIdxs: [] });
  }
  for (let i = 0; i < settled.length; i += 1) {
    const day = settled[i];
    if (!day.isRestDay) {
      slots[weekSlotOf.get(day.weekStart)].dayIdxs.push(i);
      continue;
    }
    const club = clubAt(day.date);
    // 集训周强制的是**周指令**（该周全部平日）；休息日没有这条强制（所有者 2026-10-06 明确）。
    daySlotOf.set(day.date, slots.length);
    slots.push({ kind: 'day', key: day.date, isRestDay: true, cands: availableDayCommandIds(rules, club, day.date), dayIdxs: [i] });
  }
  for (const [start2, slot] of weekSlotOf) for (const i of slots[slot].dayIdxs) daySlot[i] = slot;
  for (const [, slot] of daySlotOf) daySlot[slots[slot].dayIdxs[0]] = slot;

  const slotEff = slots.map((slot) => slot.cands.map((cmd) => effectOf(cmd, slot.isRestDay, slot.key)));

  // ---- 目标 ----
  const checkpoints = input.checkpoints;
  const ending = checkpoints.filter((c) => c.source === 'ending');
  const mini = checkpoints.filter((c) => c.source === 'mini');
  const global = checkpoints.filter((c) => c.source === 'global');
  const lastIdx = settled.length - 1;
  const miniIdx = new Map();
  for (const cp of mini) {
    let best = 0;
    for (let i = 0; i < settled.length; i += 1) if (settled[i].date <= cp.date) best = i;
    miniIdx.set(cp.id, best);
  }
  const makeGlobals = () =>
    global.map((cp) => {
      const id = cp.attribute ?? cp.attributes[0];
      const ai = index[id];
      const startMet = cp.op === '>=' ? start[ai] >= cp.value : start[ai] < cp.value;
      return { ai, op: cp.op, value: cp.value, id: cp.id, hard: startMet };
    });

  const state = new Float64Array(n);
  return {
    rules, input, calendar, settled, slots, daySlot, slotEff, ids, index, n, start, mins, maxs,
    ending, mini, global, lastIdx, miniIdx, makeGlobals, state, weekSlotOf, daySlotOf,
  };
}

// ---------------------------------------------------------------- 评价

/**
 * 一次全量评价：瘦重放（与 `apply` 同口径）+ 三类指标。
 * 返回的 `score` 只用于**搜索排序**；对外汇报的达标状态一律以 `plan()` 为准。
 */
function evaluate(problem, x) {
  problem.evaluations += 1;
  const { settled, slotEff, daySlot, state, n, start, mins, maxs, ending, mini, miniIdx, lastIdx, index } = problem;
  state.set(start);
  let absorb = 0;
  let globalPenalty = 0;
  let globalViolationDays = 0;
  let globalUnmetDays = 0;
  const globals = problem.makeGlobals();
  let finalState = null;
  const miniState = new Map();

  for (let i = 0; i < settled.length; i += 1) {
    const s = daySlot[i];
    const ci = x[s];
    if (ci >= 0) {
      const eff = slotEff[s][ci];
      for (let a = 0; a < n; a += 1) {
        const pre = state[a] + eff[a];
        const v = pre < mins[a] ? mins[a] : pre > maxs[a] ? maxs[a] : pre;
        state[a] = v;
        if (v > pre) absorb += v - pre;
      }
    }
    for (const g of globals) {
      const v = state[g.ai];
      const met = g.op === '>=' ? v >= g.value : v < g.value;
      if (met) g.hard = true;
      else if (g.hard) {
        // 已达成后又跌破：全局硬违反（分层①）
        globalPenalty += g.op === '>=' ? (g.value - v) / g.value : (v - g.value) / g.value;
        globalViolationDays += 1;
      } else {
        // **还没达成**：每一天记一天（分层②）。
        // 旧版这里什么都不记——"从未达成的全局约束"因此在目标函数里毫无分量，
        // 这就是放松结局目标后全局约束被丢掉的原因。
        globalUnmetDays += 1;
      }
    }
    for (const [cpId, i0] of miniIdx) if (i0 === i) miniState.set(cpId, Float64Array.from(state));
    if (i === lastIdx) finalState = Float64Array.from(state);
  }

  // ① 始终没达成的全局约束条数：`hard` 一旦置真就不再回落，所以循环结束后它仍为假 = 从没达成过。
  let globalUnmetCount = 0;
  for (const g of globals) if (!g.hard) globalUnmetCount += 1;

  const items = [];
  for (const cp of ending) {
    const id = cp.attribute ?? cp.attributes[0];
    const v = (finalState ?? state)[index[id]];
    items.push({
      id: cp.id,
      kind: 'ending',
      actual: v,
      op: cp.op,
      value: cp.value,
      ok: cp.op === '>=' ? v >= cp.value : v < cp.value,
    });
  }
  for (const cp of mini) {
    const snap = miniState.get(cp.id);
    const names = cp.attributes ?? [cp.attribute];
    const v = names.reduce((sum, id) => sum + (snap ? snap[index[id]] : 0), 0);
    items.push({
      id: cp.id,
      kind: 'mini',
      actual: v,
      op: cp.op,
      value: cp.value,
      ok: cp.op === '>=' ? v >= cp.value : v < cp.value,
    });
  }
  // 小目标与结局目标**分开计层**（所有者优先级：小目标先于结局目标）。
  let unmetMini = 0;
  let unmetEnding = 0;
  let miniShortfall = 0;
  let endingShortfall = 0;
  for (const item of items) {
    if (item.ok) continue;
    const need = item.op === '>=' ? item.value - item.actual : item.actual - item.value + 1e-9;
    const gap = Math.max(0, need) / Math.max(1, Math.abs(item.value));
    if (item.kind === 'mini') {
      unmetMini += 1;
      miniShortfall += gap;
    } else {
      unmetEnding += 1;
      endingShortfall += gap;
    }
  }
  // 分层权重：每层取值的上限都小于上一层的一个单位，所以低层改善永远盖不过上层改善。
  const score =
    globalUnmetCount * 1e9 +
    globalViolationDays * 1e5 +
    unmetMini * 1e4 +
    miniShortfall * 1e3 +
    unmetEnding * 1e2 +
    endingShortfall * 1e1 +
    globalUnmetDays * 1e-3 +
    globalPenalty * 1e-5 +
    absorb * 1e-9;
  return {
    score,
    globalUnmetCount,
    globalViolationDays,
    globalUnmetDays,
    unmetMini,
    unmetEnding,
    miniShortfall,
    endingShortfall,
    // 合成值只为日志好读；**比较一律走 betterThan**，不看合成值。
    unmet: unmetMini + unmetEnding,
    shortfall: miniShortfall + endingShortfall,
    globalPenalty,
    globalDays: globalViolationDays,
    absorb,
    items,
  };
}

// ---------------------------------------------------------------- 搜索

function toAssignments(problem, x) {
  const weekCommands = {};
  const dayCommands = {};
  for (let s = 0; s < problem.slots.length; s += 1) {
    const slot = problem.slots[s];
    const cmd = slot.cands[x[s]];
    if (slot.kind === 'week') weekCommands[slot.key] = cmd;
    else dayCommands[slot.key] = cmd;
  }
  return { weekCommands, dayCommands };
}

/**
 * **规范序**（与搜索用的加权标量无关，逐层比较、不经标量）：
 *   全局硬违反天数 → 全局未达成天数 → 小目标未达标数 → 小目标缺口 →
 *   结局未达标数 → 结局缺口 → 全局跌破幅度 → 夹逼吸收。
 *
 * 这就是所有者定的"全局约束 → 小目标 → 结局目标"，一层都不能少。
 */
function betterThan(a, b) {
  if (a.globalUnmetCount !== b.globalUnmetCount) return a.globalUnmetCount < b.globalUnmetCount;
  if (a.globalViolationDays !== b.globalViolationDays) return a.globalViolationDays < b.globalViolationDays;
  if (a.unmetMini !== b.unmetMini) return a.unmetMini < b.unmetMini;
  if (Math.abs(a.miniShortfall - b.miniShortfall) > 1e-9) return a.miniShortfall < b.miniShortfall;
  if (a.unmetEnding !== b.unmetEnding) return a.unmetEnding < b.unmetEnding;
  if (Math.abs(a.endingShortfall - b.endingShortfall) > 1e-9) return a.endingShortfall < b.endingShortfall;
  if (a.globalUnmetDays !== b.globalUnmetDays) return a.globalUnmetDays < b.globalUnmetDays;
  if (Math.abs(a.globalPenalty - b.globalPenalty) > 1e-9) return a.globalPenalty < b.globalPenalty;
  return a.absorb < b.absorb;
}

/** 兜底初始解：全部休息周 + 休息日日指令（确定性、与数据无关）。 */
function restVector(problem) {
  const x = new Int32Array(problem.slots.length);
  for (let s = 0; s < problem.slots.length; s += 1) {
    const ci = problem.slots[s].cands.indexOf('cmd-rest');
    x[s] = ci >= 0 ? ci : 0;
  }
  return x;
}

/**
 * 暖启动种子：配额层的"缺口驱动贪心"（`src/quota.js`）。
 *
 * 为什么需要：从"全休息"冷启动时，30 s 预算内的下降只能爬到 6–7/11；配额层先用
 * **与顺序无关**的性质（指令无副作用 ⇒ 终值只取决于各条用了几次）把资源摊到最缺的
 * 那几项上，给下降一个"主攻方向已经对了"的起点。
 *
 * 配额层与下降层同口径（都用 `expectedEffects`），所以它给的是同一个世界里的解，
 * 不会把搜索带偏。失败时退回兜底起点，不让求解整体失败。
 */
function quotaVector(problem) {
  const x = restVector(problem);
  try {
    const quota = allocateQuota(problem.rules, problem.input);
    for (const week of quota.plan ?? []) {
      const slot = problem.weekSlotOf.get(week.weekStart);
      if (slot !== undefined) {
        const ci = problem.slots[slot].cands.indexOf(week.commandId);
        if (ci >= 0) x[slot] = ci;
      }
      for (const rest of week.restCommands ?? []) {
        const dayIndex = problem.daySlotOf.get(rest.date);
        if (dayIndex === undefined) continue;
        const ci = problem.slots[dayIndex].cands.indexOf(rest.commandId ?? 'skip');
        if (ci >= 0) x[dayIndex] = ci;
      }
    }
    return { x, quotaUnmet: quota.unmet ?? null };
  } catch {
    return { x, quotaUnmet: null };
  }
}

/**
 * 让出一次**宏任务**。搜索整体是同步的（约 15–20 s），而 Worker 的取消消息是宏任务——
 * 不让出的话，`shouldStop()` 在整个搜索期间永远不会变成真，取消按钮等于失效
 * （实测：不让出时取消要等整段搜索跑完）。让出的位置在"每轮全槽下降之后"与"每次 ILS 之前"，
 * 所以取消延迟是一轮下降的量级（亚秒），而搜索结果与让出无关——工作量档位仍然是确定的。
 */
function yieldToHost() {
  return new Promise((resolve) => {
    setTimeout(resolve, 0);
  });
}

async function runDescent(rules, input, options = {}) {
  const shouldStop = options.shouldStop ?? (() => false);
  const budgetMs = options.budgetMs ?? DEFAULT_BUDGET_MS;
  // 工作量：显式给定优先；否则由**请求的预算**决定一档固定值（见 workProfileFor）。
  const profile = workProfileFor(budgetMs);
  const passes = options.passes ?? profile.passes;
  const ils = options.ils ?? profile.ils;
  const kick = options.kick ?? DEFAULT_KICK;
  const seed = options.seed ?? 20261006;
  const repairFirst = options.repairFirst ?? profile.repairFirst;
  const repairLast = options.repairLast ?? profile.repairLast;
  const startedAt = Date.now();
  const deadline = startedAt + budgetMs;

  const problem = { ...buildProblem(rules, input), evaluations: 0 };
  const rng = mulberry32(seed);
  const warm = options.warmStart === false ? { x: restVector(problem), quotaUnmet: null } : quotaVector(problem);
  const x = warm.x;

  const order = [...problem.slots.keys()];
  let current = evaluate(problem, x);
  let best = current;
  const bestX = Int32Array.from(x);
  let cancelled = false;
  let iterations = 0;
  let repairIterations = 0;

  // **墙钟只是安全阀**：主判据是上面那组固定工作量（passes / ils / repairFirst / repairLast），
  // 它在进入搜索前就定死了，所以"跑完计划工作量"这条路径与机器快慢无关。
  // 安全阀触发时结果会停在不同迭代上——那种情况必须**标注**出来（`reproducible: false`），
  // 不能假装它和平时一样可复现。
  const outOfTime = () => Date.now() >= deadline || shouldStop();
  let stoppedBy = 'work-limit';

  /**
   * 一次全槽最速下降。`weight` 只影响**方向**；是否更优由加权代价判断（同阶段内可比）。
   *
   * 取消/超时**不改变**已完成的轮数语义：它是安全阀，触发时把 `cancelled` 置真并立刻返回。
   */
  async function descend() {
    for (let pass = 0; pass < passes; pass += 1) {
      let improved = false;
      for (let i = order.length - 1; i > 0; i -= 1) {
        const j = Math.floor(rng() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      for (const s of order) {
        const original = x[s];
        let bestCand = original;
        let bestScore = current.score;
        for (let ci = 0; ci < problem.slots[s].cands.length; ci += 1) {
          if (ci === original) continue;
          x[s] = ci;
          const result = evaluate(problem, x);
          if (result.score < bestScore - 1e-12) {
            bestScore = result.score;
            bestCand = ci;
            current = result;
          }
        }
        x[s] = bestCand;
        if (bestCand !== original) improved = true;
        if (outOfTime()) {
          stoppedBy = shouldStop() ? 'cancelled' : 'wall-clock';
          cancelled = true;
          return improved;
        }
      }
      await yieldToHost();
      if (!improved) break;
    }
    return false;
  }

  /** 调试日志用的一行摘要（分层顺序）。 */
  const describe = (r) =>
    `(全局未达成${r.globalUnmetCount}条/违反${r.globalViolationDays}天, 小${r.unmetMini}/${r.miniShortfall.toFixed(3)}, 结局${r.unmetEnding}/${r.endingShortfall.toFixed(3)}, 达标日${r.globalUnmetDays}, 吸收${r.absorb.toFixed(1)})`;

  const snapshot = () => {
    bestX.set(x);
    best = current;
  };

  /** 迭代局部搜索：扰动 k 个槽再下降，只接受**规范序**更优者。 */
  async function iterate(count) {
    let done = 0;
    for (let it = 0; it < count; it += 1) {
      await yieldToHost();
      const y = Int32Array.from(bestX);
      const k = 1 + Math.floor(rng() * kick);
      for (let t = 0; t < k; t += 1) {
        const s = Math.floor(rng() * y.length);
        y[s] = Math.floor(rng() * problem.slots[s].cands.length);
      }
      x.set(y);
      current = evaluate(problem, x);
      await descend();
      done += 1;
      if (betterThan(current, best)) {
        if (typeof process !== 'undefined' && process.env?.DESCENT_DEBUG) {
          // eslint-disable-next-line no-console
          console.log(`[iter ${it}] 改善：${describe(best)} → ${describe(current)}`);
        }
        snapshot();
      }
      if (outOfTime()) {
        stoppedBy = shouldStop() ? 'cancelled' : 'wall-clock';
        cancelled = true;
        break;
      }
    }
    return done;
  }

  /**
   * 统一收尾：两条出口（"预算过小直接退回基线"与"跑完阶段"）共用一份 metrics 组装，
   * 免得两处口径分叉。
   */
  function finish(overrides = {}) {
    const stopped = overrides.stoppedBy ?? stoppedBy;
    const wasCancelled = overrides.cancelled ?? cancelled;
    return {
      assignments: toAssignments(problem, bestX),
      metrics: {
        seed,
        passes,
        ils,
        kick,
        repairFirst,
        repairLast,
        // 计划工作量（确定性）与"本次实际跑了多少"分开报：前者是承诺，后者是实际。
        work: { passes, ils, repairFirst, repairLast },

  // 三态：met 达标 / unmet 还欠着（还没到过）/ violated 已破线（到过之后又跌破，一次即永久）。
  const goalState = evaluation ? evaluation.state : null;

  const row = document.createElement('div');
  row.className = `goal-row ${goalState ?? ''}`.trim();

  // 第 1 列：落点 + 属性（CSS 给了 6 列，落点与属性合并成一列显示）。
  // 例外：结局目标的落点是固定不变的（时间轴终点），显示它没有信息量，所以只写属性名。
  const nameCell = document.createElement('span');
  nameCell.className = 'name';
  const isEnding = checkpoint.source === 'ending';
  nameCell.textContent = isEnding
    ? checkpointAttributesText(checkpoint)
    : `${checkpointLandingText(checkpoint)} · ${checkpointAttributesText(checkpoint)}`;
  // 说明文字按来源分三种：全局约束没有落点日期（`date` 恒为 null），结局目标的落点固定、
  // 写出来没有信息量，所以两者都不拼日期——只有小目标写「在 <日期> 结算后评估」。
  nameCell.title = isEnding
    ? '毕业时的目标'
    : checkpoint.source === 'global'
      ? globalTooltip(evaluation)
      : `在 ${checkpoint.date} 结算后评估`;

  const thresholdCell = document.createElement('span');
  thresholdCell.className = 'v';
  thresholdCell.textContent = `${opText(checkpoint.op)} ${checkpoint.value}`;

  const actualCell = document.createElement('span');
  actualCell.className = 'v';
  actualCell.textContent = evaluation ? fmt1(evaluation.actual) : '—';

  const gapCell = document.createElement('span');
  gapCell.className = 'gap';
  if (goalState === 'unmet') gapCell.textContent = `还差 ${fmt1(evaluation.shortfall)}`;
  else if (goalState === 'violated') gapCell.textContent = `破线 ${fmt1(evaluation.shortfall)}`;
  else gapCell.textContent = '—';

  const stateCell = document.createElement('span');
  stateCell.className = 'state';
  if (goalState !== null) {
    const dot = document.createElement('i');
    dot.className = `dot ${goalState}`;
    stateCell.append(dot);
    const text = document.createElement('span');
    text.textContent = goalState === 'met' ? '达标' : goalState === 'violated' ? '已破线' : '未达标';
    stateCell.append(text);
    stateCell.title = stateTitle(evaluation);
  } else {
    stateCell.textContent = '未计算';
  }

  const actionCell = document.createElement('span');
  actionCell.className = 'row-actions';
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'btn';
  edit.textContent = '✎';
  edit.title = '编辑';
  edit.addEventListener('click', () => openCheckpointEditor(index));
  actionCell.append(edit);

  // 结局行不可删：它是最后一个检查点，覆盖除社团经验以外的每一项属性。
  if (checkpoint.source !== 'ending') {
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'btn';
    remove.textContent = '×';
    remove.title = '删除';
    remove.addEventListener('click', () => removeCheckpoint(index));
    actionCell.append(remove);
  }

  row.append(nameCell, thresholdCell, actualCell, gapCell, stateCell, actionCell);
  return row;
}

function columnsRow(source) {
  const row = document.createElement('div');
  row.className = 'goal-cols';
  const first = source === 'ending' ? '属性' : '落点 · 属性';
  for (const label of [first, '阈值', '当前值', '差距', '状态', '']) {
    const span = document.createElement('span');
    span.textContent = label;
    row.append(span);
  }
  return row;
}

function groupHeader(title, countText, onAdd) {
  const header = document.createElement('header');
  const label = document.createElement('span');
  label.textContent = title;
  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = countText;
  header.append(label, count);
  if (onAdd) {
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'btn';
    add.textContent = '+ 加一条';
    add.addEventListener('click', onAdd);
    header.append(add);
  }
  return header;
}

/** 检查点区域的三段分组（所有者要求保留这个划分）。 */
const GOAL_GROUPS = [
  { source: 'ending', title: '结局目标', order: 'attribute' },
  { source: 'mini', title: '小目标', order: 'date' },
  { source: 'global', title: '全局约束', order: 'attribute' },
];

/**
 * 属性在数据里的默认顺序（体力 → … → 压力，社团经验在最后）；结局目标与全局约束用它排列。
 *
 * ⚠️ 这是**加载时的快照**，顺序就是 `data/rules.json` 里 `attributes` 的书写次序。
 * 界面不得提供"重排属性"的功能——那会让这里静默过期（排序会一直用旧顺序）。
 * 要改顺序就改数据文件。
 */
const ATTRIBUTE_ORDER = new Map(RULES.attributes.map((attribute, index) => [attribute.id, index]));

/** 排序键：属性组取"集合里最早出现的那个属性"的下标；未知属性排到最后。 */
function orderValue(checkpoint, order) {
  if (order === 'date') return checkpoint.date ?? '';
  const ranks = checkpointAttributeIds(checkpoint)
    .map((id) => ATTRIBUTE_ORDER.get(id))
    .filter((rank) => rank !== undefined);
  return ranks.length > 0 ? Math.min(...ranks) : ATTRIBUTE_ORDER.size;
}

function renderGoals() {
  const host = $('goals');
  host.textContent = '';
  host.classList.toggle('stale', isStale());

  const items = goalItems();
  const head = document.createElement('div');
  head.className = 'goals-head';
  const title = document.createElement('span');
  title.textContent = '检查点';
  const count = document.createElement('span');
  count.className = 'count';
  if (items.length > 0) {
    // 计数只看**数据里声明的检查点**，避免把"未设目标"的兜底条目算进达标率。
    const declared = state.input.checkpoints.map((checkpoint) => evaluationOf(checkpoint.id));
    const metOf = (source) =>
      declared.filter((evaluation) => evaluation?.source === source && evaluation.state === 'met').length;
    const violatedOf = (source) =>
      declared.filter((evaluation) => evaluation?.source === source && evaluation.state === 'violated').length;
    const totalOf = (source) =>
      state.input.checkpoints.filter((checkpoint) => checkpoint.source === source).length;
    // 只保留玩家看得懂的分项：结局目标 / 小目标 / 全局约束，外加一个总达标率。
    // "未设目标"的兜底条目不进这里的任何计数——它不是玩家设的目标（见 GLOSSARY：未设目标）。
    count.textContent = `达标 ${declared.filter((evaluation) => evaluation?.state === 'met').length}/${
      declared.length
    } · 结局目标 ${metOf('ending')}/${totalOf('ending')} · 小目标 ${metOf('mini')}/${totalOf(
      'mini',
    )} · 全局约束 ${metOf('global')}/${totalOf('global')}${
      violatedOf('global') > 0 ? `（${violatedOf('global')} 条已破线）` : ''
    }`;
  } else {
    count.textContent = '尚未计算——下面的状态列显示「未计算」';
  }
  head.append(title, count);
  host.append(head);

  const indexed = state.input.checkpoints.map((checkpoint, index) => ({ checkpoint, index }));
  for (const { source, title: groupTitle, order } of GOAL_GROUPS) {
    const rows = indexed
      .filter(({ checkpoint }) => checkpoint.source === source)
      // 先算一次排序键，再排；并列时用数据里的原始下标，保证顺序稳定、重绘不跳动。
      .map((row) => ({ ...row, sortKey: orderValue(row.checkpoint, order) }))
      .sort((a, b) => (a.sortKey === b.sortKey ? a.index - b.index : a.sortKey < b.sortKey ? -1 : 1));
    const group = document.createElement('div');
    group.className = 'goal-group';
    // 结局目标是**固定九项属性**（每个属性一条，社团经验不在其中），所以不给「加一条」——
    // 加了也只会出现重复属性。要改阈值直接改行里的数值。
    group.append(
      groupHeader(
        groupTitle,
        `${rows.length} 条`,
        source === 'ending'
          ? null
          : () => openCheckpointEditor(null, { source, date: state.selection.to }),
      ),
    );
    group.append(columnsRow(source));
    for (const { checkpoint, index } of rows) group.append(checkpointRow(checkpoint, index));
    host.append(group);
  }
}

// ---------------------------------------------------------------- 右键菜单

function closeMenu() {
  $('menu').hidden = true;
}

function menuItem(label, onClick, { disabled = false, title } = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'menu-item';
  button.textContent = label;
  if (title) button.title = title;
  button.disabled = disabled;
  if (!disabled) {
    button.addEventListener('click', () => {
      closeMenu();
      onClick();
    });
  }
  return button;
}

function separator() {
  const node = document.createElement('div');
  node.className = 'menu-sep';
  return node;
}

function openMenu(clientX, clientY, date) {
  const host = $('menu');
  host.textContent = '';

  const dates = selectedDates();
  const range = isRangeSelection();
  const skipped = dates.filter((entry) => state.input.skippedDays.includes(entry));
  const checkpointsOnDate = state.input.checkpoints.filter((checkpoint) => checkpoint.date === date).length;

  host.append(menuItem('指定指令…', () => openCommandPicker()));
  host.append(
    menuItem('切换社团…', () => openClubPicker(state.selection.to), {
      disabled: weekdayOf(date) !== 0,
      title: weekdayOf(date) === 0 ? undefined : '社团只能在周日加入、更换或退出',
    }),
  );
  host.append(separator());
  host.append(
    menuItem(range ? `跳过这 ${dates.length} 天` : '跳过这一天', () => setSkipped(dates, true), {
      disabled: dates.length === 0,
    }),
  );
  host.append(
    menuItem(
      skipped.length > 0 ? `取消跳过（${skipped.length}）` : '取消跳过',
      () => setSkipped(dates, false),
      { disabled: skipped.length === 0 },
    ),
  );
  host.append(separator());
  host.append(
    menuItem('添加检查点…', () => openCheckpointEditor(null, { date }), {
      disabled: range,
      title: range ? '检查点挂在具体某一天（全局约束除外），请先只选一天' : undefined,
    }),
  );
  host.append(
    menuItem(
      checkpointsOnDate > 0 ? `管理这一天的检查点（${checkpointsOnDate}）` : '管理这一天的检查点',
      () => openCheckpointList(date),
      { disabled: range || checkpointsOnDate === 0 },
    ),
  );
  host.append(separator());
  host.append(
    menuItem(`设为已玩到（${state.selection.to}）`, () => setPlayedUpTo(state.selection.to), {
      title: '它同时是时间轴的起点；取选区的最后一天',
    }),
  );

  host.hidden = false;
  const box = host.getBoundingClientRect();
  const left = Math.min(clientX, window.innerWidth - box.width - 6);
  const top = Math.min(clientY, window.innerHeight - box.height - 6);
  host.style.left = `${Math.max(4, left)}px`;
  host.style.top = `${Math.max(4, top)}px`;
}

// ---------------------------------------------------------------- 指定指令

function currentChoiceOf(dates) {
  const anchor = dates[dates.length - 1];
  const isSunday = weekdayOf(anchor) === 0;
  const value =
    isSunday || isRestOn(anchor)
      ? state.input.dayCommands[anchor]
      : state.input.weekCommands[weekStartOf(anchor)];
  return commandIdToChoice(value);
}

/** 社团切换：只在周日可行，且工具绝不自行选择或切换（原规格故事 23）。 */
function openClubPicker(date) {
  const existing = state.input.clubChanges.find((entry) => entry.date === date);
  const value =
    existing === undefined ? UNSET : existing.clubId === null ? CHOICE_NO_CLUB : existing.clubId;
  const select = selectOf(
    [
      [UNSET, '不切换（沿用之前的社团）'],
      [CHOICE_NO_CLUB, '退出社团'],
      ...CLUBS.map((club) => [club.id, club.name]),
    ],
    value,
  );

  const currentClub = clubAt(date);
  const body = document.createElement('div');
  body.append(field('社团', select));
  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = `自 ${date}（周日）起生效，并影响该周日的日指令。当天生效的社团：${
    currentClub ? CLUBS.find((entry) => entry.id === currentClub)?.name ?? currentClub : '未加入'
  }。`;
  body.append(hint);

  openModal({
    title: `切换社团（${date}）`,
    body,
    actions: [
      { label: '取消', onClick: closeModal },
      {
        label: '确定',
        primary: true,
        onClick: () => {
          setClubChange(date, select.value);
          closeModal();
        },
      },
    ],
  });
}

function openCommandPicker() {
  const dates = selectedDates();
  if (dates.length === 0) return;
  const anchor = state.selection.to;
  const entries = [
    [UNSET, '清除指定'],
    [CHOICE_EMPTY, '空过'],
    ...commandsAvailableAt(anchor).map((command) => [command.id, command.name]),
  ];
  const select = selectOf(entries, currentChoiceOf(dates));

  const dayCount = dates.filter((entry) => isRestOn(entry)).length;
  const weekdayDates = dates.filter((entry) => weekdayOf(entry) !== 0);
  const weeks = new Set(weekdayDates.map((entry) => weekStartOf(entry)));
  const spill = Math.max(0, weeks.size * 6 - weekdayDates.length);

  const scope = document.createElement('p');
  scope.className = 'hint';
  scope.textContent =
    dayCount > 0 || weeks.size > 0
      ? `将写入 ${dayCount} 天的日指令、${weeks.size} 周的周指令。周一至周六执行的是整周周指令，所以这些周里最多还有 ${spill} 个未被选中的平日会跟着改。`
      : '没有可写入的日期。';

  const body = document.createElement('div');
  body.append(field('指令', select), scope);

  openModal({
    title: `指定指令（${dates.length} 天）`,
    body,
    actions: [
      { label: '取消', onClick: closeModal },
      {
        label: '确定',
        primary: true,
        onClick: () => {
          setCommands(dates, select.value);
          closeModal();
        },
      },
    ],
  });
}

// ---------------------------------------------------------------- 检查点弹窗

/**
 * 一条检查点的编辑器。
 *
 * `index === null` 是新行：可以选来源（全局 / 小目标 / 结局），落点与属性控件随来源变。
 * 编辑已有行时来源不可改（改来源会连带改落点语义，容易把输入改得不合法）。
 */
function openCheckpointEditor(index, options = {}) {
  const isNew = index === null;
  let source = isNew ? options.source ?? 'mini' : state.input.checkpoints[index].source;
  // 结局目标是固定九项属性（每项一条，社团经验不在其中），没有"再加一条"的语义：
  // 加了只会产出重复属性。渲染层已经不画「加一条」，这里再挡一次——
  // 否则将来接上别的入口（右键菜单等）就能造出重复项。
  if (isNew && source === 'ending') return;
  // 新行的默认日期：右键那天 / 当前选区 / 时间轴最后结算日。
  let draft = isNew
    ? defaultCheckpoint(source, options.date ?? state.selection.to ?? TIMELINE.lastSettlement)
    : { ...state.input.checkpoints[index] };

  const render = () => {
    const body = document.createElement('div');

    const sourceSelect = isNew
      ? selectOf(SOURCE_ENTRIES, source)
      : null;
    if (sourceSelect) {
      sourceSelect.addEventListener('change', () => {
        source = sourceSelect.value;
        draft = defaultCheckpoint(source, options.date ?? state.selection.to ?? TIMELINE.lastSettlement);
        render();
      });
      body.append(field('来源', sourceSelect));
    } else {
      const fixed = document.createElement('p');
      fixed.className = 'hint';
      fixed.textContent = `来源：${CHECKPOINT_SOURCE_LABELS[source]}（不可更改）`;
      body.append(fixed);
    }

    // 落点
    if (source === 'global') {
      const text = document.createElement('p');
      text.className = 'hint';
      text.textContent = '落点：每个结算日都查一次，用的是当天的数值。';
      body.append(text);
    } else if (source === 'ending') {
      const text = document.createElement('p');
      text.className = 'hint';
      text.textContent = `落点：${TIMELINE.end}（时间轴终点，固定）`;
      body.append(text);
    } else {
      const date = document.createElement('input');
      date.type = 'date';
      date.min = TIMELINE.start;
      date.max = TIMELINE.lastSettlement;
      date.value = draft.date;
      date.addEventListener('change', () => {
        draft = { ...draft, date: date.value };
      });
      body.append(field('截止日期', date));
    }

    // 属性：全局/结局是单属性；小目标可以多选（阈值作用于求和）。
    let picker = null;
    let attributeSelect = null;
    if (source === 'mini') {
      picker = attributePicker(ATTRIBUTES, checkpointAttributeIds(draft));
      body.append(field('属性集合（求和）', picker));
    } else {
      attributeSelect = selectOf(ATTRIBUTES.map((entry) => [entry.id, entry.name]), draft.attribute);
      body.append(field('属性', attributeSelect));
    }

    const op = selectOf(OP_ENTRIES, draft.op);
    const value = numberInput(draft.value, { min: 0, max: 9999, step: 1 });
    body.append(field('方向', op), field('阈值', value));

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent =
      source === 'global'
        ? '每个结算日都查一次：还没到过阈值时只是欠着；一旦到过，以后任何时候跌破都算「已破线」，这份日程就不合格了。'
        : source === 'mini'
          ? '阈值作用于所选属性的求和；集合里可以只选「社团经验」。'
          : '结局目标在时间轴终点逐项评估，不可删除。';
    body.append(hint);

    openModal({
      title: isNew ? `添加${CHECKPOINT_SOURCE_LABELS[source]}` : `编辑${CHECKPOINT_SOURCE_LABELS[source]}`,
      body,
      actions: [
        { label: '取消', onClick: closeModal },
        {
          label: isNew ? '添加' : '保存',
          primary: true,
          onClick: () => {
            const patch = {
              op: op.value,
              value: Number(value.value),
            };
            if (source === 'mini') {
              const attributes = pickedAttributes(picker);
              if (attributes.length === 0) {
                hint.textContent = '至少要选一个属性。';
                return;
              }
              patch.attributes = attributes;
              delete patch.attribute;
            } else {
              patch.attribute = attributeSelect.value;
              delete patch.attributes;
            }
            if (source === 'mini') patch.date = draft.date;
            if (isNew) addCheckpoint({ ...draft, ...patch, source });
            else updateCheckpoint(index, patch);
            closeModal();
          },
        },
      ],
    });
  };

  render();
}

/** 这一天落地的检查点（只列具体日期的：全局约束是"每个结算日"，不是某一天专属）。 */
function openCheckpointList(date) {
  const body = document.createElement('div');
  const list = document.createElement('div');
  list.className = 'modal-list';
  const heading = document.createElement('h4');
  heading.textContent = `${date} 的检查点`;
  list.append(heading);

  const rows = state.input.checkpoints
    .map((checkpoint, index) => ({ checkpoint, index }))
    .filter(({ checkpoint }) => checkpoint.date === date);

  for (const { checkpoint, index } of rows) {
    const row = document.createElement('div');
    row.className = 'mini-row';
    const name = document.createElement('span');
    name.textContent = `${checkpointAttributesText(checkpoint)} ${opText(checkpoint.op)} ${checkpoint.value}`;
    const evaluation = evaluationOf(checkpoint.id);
    const stateCell = document.createElement('span');
    stateCell.className = 'v';
    stateCell.textContent = evaluation
      ? evaluation.state === 'met'
        ? '达标'
        : evaluation.state === 'violated'
          ? '已破线'
          : '未达标'
      : '未计算';
    const actions = document.createElement('span');
    actions.className = 'row-actions';
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'btn';
    edit.textContent = '✎';
    edit.title = '编辑';
    edit.addEventListener('click', () => {
      closeModal();
      openCheckpointEditor(index);
    });
    actions.append(edit);
    if (checkpoint.source !== 'ending') {
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'btn';
      remove.textContent = '×';
      remove.title = '删除';
      remove.addEventListener('click', () => {
        removeCheckpoint(index);
        closeModal();
      });
      actions.append(remove);
    }
    row.append(name, stateCell, actions);
    list.append(row);
  }

  const jump = document.createElement('button');
  jump.type = 'button';
  jump.className = 'btn';
  jump.textContent = '跳到这一天';
  jump.addEventListener('click', () => {
    closeModal();
    jumpToDate(date);
  });
  body.append(list, jump);

  openModal({
    title: `${date} 的检查点`,
    body,
    actions: [
      { label: '关闭', onClick: closeModal },
      {
        label: '添加',
        primary: true,
        onClick: () => {
          closeModal();
          openCheckpointEditor(null, { date });
        },
      },
    ],
  });
}

// ---------------------------------------------------------------- 接线

function wirePanels() {
  $('calendar').addEventListener('contextmenu', (event) => {
    // Shift+右键放行浏览器原生菜单：不能因为做了右键菜单就吞掉"另存为/检查元素"。
    if (event.shiftKey) return;
    const cell = event.target.closest('.cell');
    if (!cell || cell.classList.contains('is-ovf')) return;
    event.preventDefault();
    const date = cell.dataset.date;
    const { from, to } = state.selection;
    if (date < from || date > to) selectDate(date);
    openMenu(event.clientX, event.clientY, date);
  });

  $('btn-more').addEventListener('click', (event) => {
    const box = event.currentTarget.getBoundingClientRect();
    openMenu(box.left, box.bottom + 4, state.selection.to);
  });

  document.addEventListener('mousedown', (event) => {
    if ($('menu').hidden) return;
    // target 不一定是元素（点在滚动条或空白处时是 document），所以先判类型再 closest，
