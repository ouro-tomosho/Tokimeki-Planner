<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Tokimeki-Planner</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: #d0d5dd;
        --bg-soft: #f6f7f9;
        --accent: #2f6fed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
        line-height: 1.6;
        color: #1a1c1f;
        background: #fff;
      }
      header {
        padding: 18px 22px 12px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 19px;
      }
      header p {
        margin: 4px 0 0;
        font-size: 13px;
        color: #5b6472;
      }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 400px) 1fr;
        gap: 0;
        min-height: calc(100vh - 78px);
      }
      #input-pane {
        padding: 18px 22px;
        border-right: 1px solid var(--line);
        background: var(--bg-soft);
      }
      #result-pane {
        padding: 18px 22px;
        overflow: auto;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 10px;
        letter-spacing: 0.04em;
        color: #3b4250;
      }
      .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .field input {
        width: 96px;
        padding: 4px 6px;
        font: inherit;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #fff;
      }
      #attributes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
        margin-bottom: 16px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      button,
      .file-button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .file-button input {
        display: none;
      }
      small {
        display: block;
        color: #5b6472;
        font-size: 12px;
      }
      #status {
        font-size: 13px;
        padding: 9px 12px;
        border-radius: 6px;
        background: #eef1f5;
        margin-bottom: 14px;
        white-space: pre-wrap;
      }
      #status.error {
        background: #fdeceb;
        color: #8c1d18;
      }
      #result-body dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 16px;
        font-size: 13px;
        margin: 0;
      }
      #result-body dt {
        color: #5b6472;
      }
      #result-body dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tokimeki-Planner</h1>
      <p>《心跳回忆·永远属于你》（95 版）日程规划工具 · 单文件、离线、零依赖</p>
    </header>

    <main>
      <section id="input-pane">
        <h2>起点</h2>
        <div class="field">
          <span>当前日期</span>
          <input id="start-date" type="date" />
        </div>

        <h2 style="margin-top: 18px">当前属性</h2>
        <div id="attributes"></div>

        <div class="actions">
          <button id="btn-plan" class="primary" type="button">生成</button>
          <button id="btn-export" type="button">导出 JSON</button>
          <label class="file-button">
            导入 JSON
            <input id="file-import" type="file" accept="application/json,.json" />
          </label>
        </div>
        <small>JSON 只保存输入，结果永远由输入重新算出。</small>
      </section>

      <section id="result-pane">
        <h2>结果</h2>
        <div id="status">尚未计算。</div>
        <div id="result-body"></div>
      </section>
    </main>
